<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body style="margin:0"><script type="module">
import * as T from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const renderer = new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1200,1200); renderer.setPixelRatio(1); renderer.setClearColor(0xffffff,0);
renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);
const scene=new T.Scene();
const pmrem=new T.PMREMGenerator(renderer); scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new T.PerspectiveCamera(32,1,.1,100); camera.position.set(0,0,9.3);
scene.add(new T.HemisphereLight(0xf2f8ff,0x8798c8,2.2));
const light=new T.DirectionalLight(0xffffff,4);light.position.set(4,6,5);scene.add(light);
const blue=new T.DirectionalLight(0x84b5ff,3);blue.position.set(-4,-1,3);scene.add(blue);
const root=new T.Group();scene.add(root);
const rings=[],beads=[],sheets=[];
const material=(color,metalness=.4)=>new T.MeshPhysicalMaterial({color,metalness,roughness:.15,clearcoat:1,clearcoatRoughness:.08,iridescence:.45,iridescenceIOR:1.35,envMapIntensity:1.7});
const colors=[0x91baff,0xc7beef,0xd6edff];
const mode=new URLSearchParams(location.search).get('scene')||'core';
if(mode==='core'){
 for(let i=0;i<3;i++){
  const ring=new T.Mesh(new T.TorusGeometry(1.26,.255,32,144),material(colors[i],i===1?.7:.45));root.add(ring);rings.push(ring);
  const edge=new T.Mesh(new T.TorusGeometry(1.27,.013,10,144),material(0xffffff,.55));edge.position.z=.255;ring.add(edge);
 }
 const center=new T.Mesh(new T.IcosahedronGeometry(.47,5),material(0x738ae5,.8));root.add(center);
 for(let i=0;i<9;i++){const b=new T.Mesh(new T.SphereGeometry(i%3===0?.1:.05,20,20),material(colors[i%3],.7));root.add(b);beads.push(b)}
 window.drawFrame=(p)=>{
  root.rotation.set(.25+p*.35,p*Math.PI*2+.2,-.25+p*.18);
  const spread=Math.sin(p*Math.PI)*.48;
  rings.forEach((r,i)=>{r.rotation.set(i===0?1.05:i===1?-.6:.3,i===1?1.15:i===2?-.85:.15,(i-1)*.65+p*(i-1)*.7);r.position.set((i-1)*spread,Math.sin(i*2.1)*spread,Math.cos(i*2.1)*spread)});
  beads.forEach((b,i)=>{const a=i/9*Math.PI*2+p*2;b.position.set(Math.cos(a)*1.9,Math.sin(a)*1.65,Math.sin(a*2)*.65)});
  renderer.render(scene,camera);return renderer.domElement.toDataURL('image/webp',.86);
 };
}else{
 const loader=new T.TextureLoader();
 const urls=['/works/system-observation.png','/works/frames/system-02.png','/works/penghu-museum-report.png','/works/frames/drone-02.png','/works/drone-safety-guide.png'];
 const textures=await Promise.all(urls.map(u=>loader.loadAsync(u)));
 for(let i=0;i<5;i++){
  const g=new T.Group();
  const sheet=new T.Mesh(new RoundedBoxGeometry(3.05,1.76,.065,3,.05),material(i===0?0xbed5f8:0xf5f7fc,.12));g.add(sheet);
  textures[i].colorSpace=T.SRGBColorSpace;
  const image=new T.Mesh(new T.PlaneGeometry(2.87,1.60),new T.MeshBasicMaterial({map:textures[i]}));image.position.z=.037;g.add(image);
  root.add(g);sheets.push(g);
 }
 window.drawFrame=(p)=>{
  const open=Math.sin(Math.PI*p);
  root.rotation.set(-.28+open*.15,-.48+Math.sin(p*Math.PI*2)*.70,-.12);
  root.scale.setScalar(.93-open*.09);
  sheets.forEach((s,i)=>{s.position.set((i-2)*.11*open,(i-2)*(.09+open*.43),(i-2)*(.085+open*.27));s.rotation.z=(i-2)*open*.045});
  renderer.render(scene,camera);return renderer.domElement.toDataURL('image/webp',.88);
 };
}
window.drawFrame(0);window.sceneReady=true;
</script></body></html>
